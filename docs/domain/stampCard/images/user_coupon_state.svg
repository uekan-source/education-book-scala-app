<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 500" width="1060" height="500" font-family="Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, sans-serif">
  <style>
    .box   { fill: #f7f8fa; stroke: #46536b; stroke-width: 1.6; }
    .term  { fill: #eeeeee; stroke: #8a8a8a; stroke-width: 1.6; }
    .name  { font-size: 15px; font-weight: bold; fill: #1a202c; }
    .sub   { font-size: 11.5px; fill: #5a6478; }
    .edge  { stroke: #46536b; stroke-width: 1.5; fill: none; }
    .edgeR { stroke: #b03a2e; stroke-width: 1.5; fill: none; }
    .lbl   { font-size: 12px; fill: #2d3748; }
    .lblR  { font-size: 12px; fill: #b03a2e; }
  </style>

  <rect x="0" y="0" width="1060" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#46536b"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#b03a2e"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- ===== 開始（2 経路） ===== -->
  <circle cx="245" cy="28" r="7" fill="#46536b"/>
  <path class="edge" d="M245,35 L245,66" marker-end="url(#ar)"/>
  <text class="lbl" x="258" y="33">1 個目のスタンプ（5.2）</text>

  <circle cx="565" cy="28" r="7" fill="#46536b"/>
  <path class="edge" d="M565,35 L565,66" marker-end="url(#ar)"/>
  <text class="lbl" x="578" y="33">必要スタンプ数 0 のクーポン</text>

  <!-- ===== 上段：生きている状態 ===== -->
  <rect class="box" x="160" y="70" width="170" height="60" rx="6"/>
  <text class="name" x="245" y="95"  text-anchor="middle">IS_COLLECTING</text>
  <text class="sub"  x="245" y="114" text-anchor="middle" fill="#5a6478">貯め中 ・ code 100</text>

  <rect class="box" x="480" y="70" width="170" height="60" rx="6"/>
  <text class="name" x="565" y="95"  text-anchor="middle">IS_AVAILABLE</text>
  <text class="sub"  x="565" y="114" text-anchor="middle" fill="#5a6478">使用可能 ・ code 200</text>

  <rect class="box" x="800" y="70" width="170" height="60" rx="6"/>
  <text class="name" x="885" y="95"  text-anchor="middle">IS_USED</text>
  <text class="sub"  x="885" y="114" text-anchor="middle" fill="#5a6478">使用済み ・ code -1</text>

  <path class="edge" d="M330,100 L476,100" marker-end="url(#ar)"/>
  <text class="lbl" x="403" y="90" text-anchor="middle">必要数に達した</text>

  <path class="edge" d="M650,90 L796,90" marker-end="url(#ar)"/>
  <text class="lbl" x="723" y="80" text-anchor="middle">注文確定</text>

  <path class="edgeR" d="M800,114 L654,114" marker-end="url(#arR)"/>
  <text class="lblR" x="727" y="132" text-anchor="middle">注文キャンセル</text>

  <!-- ===== 下段：終端の状態 ===== -->
  <rect class="term" x="280" y="280" width="170" height="60" rx="6"/>
  <text class="name" x="365" y="305" text-anchor="middle">IS_EXPIRED</text>
  <text class="sub"  x="365" y="324" text-anchor="middle" fill="#6a6a6a">期限切れ ・ code -2</text>

  <rect class="term" x="680" y="280" width="190" height="60" rx="6"/>
  <text class="name" x="775" y="305" text-anchor="middle">IS_INVALIDATED</text>
  <text class="sub"  x="775" y="324" text-anchor="middle" fill="#6a6a6a">無効化 ・ code -3</text>

  <!-- 期限切れの 2 本 -->
  <path class="edge" d="M220,130 L220,240 L320,240 L320,276" marker-end="url(#ar)"/>
  <text class="lbl" x="228" y="192">期限切れ</text>

  <path class="edge" d="M540,130 L540,240 L410,240 L410,276" marker-end="url(#ar)"/>
  <text class="lbl" x="532" y="192" text-anchor="end">期限切れ</text>

  <!-- 販売終了の 2 本 -->
  <path class="edge" d="M600,130 L600,240 L720,240 L720,276" marker-end="url(#ar)"/>
  <text class="lbl" x="608" y="192">販売終了</text>

  <path class="edgeR" d="M885,130 L885,240 L830,240 L830,276" marker-end="url(#arR)"/>
  <text class="lblR" x="893" y="188">キャンセル時に</text>
  <text class="lblR" x="893" y="204">販売終了済み</text>

  <!-- 貯め中 → 無効化（下を回す） -->
  <path class="edge" d="M185,130 L185,420 L775,420 L775,346" marker-end="url(#ar)"/>
  <text class="lbl" x="480" y="412" text-anchor="middle">販売終了</text>

  <!-- 終端マーカー -->
  <path class="edge" d="M365,340 L365,378" stroke="#8a8a8a" marker-end="url(#arG)"/>
  <circle cx="365" cy="392" r="8" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <circle cx="365" cy="392" r="4" fill="#8a8a8a"/>

  <path class="edge" d="M870,310 L928,310" stroke="#8a8a8a" marker-end="url(#arG)"/>
  <circle cx="942" cy="310" r="8" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <circle cx="942" cy="310" r="4" fill="#8a8a8a"/>

  <!-- 凡例 -->
  <rect x="160" y="462" width="18" height="3" fill="#46536b"/>
  <text class="lbl" x="186" y="469">通常の遷移</text>
  <rect x="300" y="462" width="18" height="3" fill="#b03a2e"/>
  <text class="lblR" x="326" y="469">注文キャンセルに伴う遷移（5.3）</text>
  <text class="lbl" x="600" y="469" fill="#8a8a8a">二重丸は終端。ここから先へ進まない</text>
</svg>
